<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Animal Explorer</title>
  <style>
    body { background: linear-gradient(to top, #673AB7, #3F51B5); color: white; padding: 30px; animation: fadeIn 2s; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    #aiInput { width: 70%; padding: 15px; border-radius: 5px; border: none; box-shadow: 0 2px 15px rgba(0,0,0,0.3); }
    button { padding: 15px 30px; background: #FF5722; border: none; color: white; cursor: pointer; transition: transform 0.3s; }
    button:hover { transform: scale(1.1); }
    #result { margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.3); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <h1>AI-Powered Animal Facts</h1>
  <p>Ask AI for creative animal insights!</p>
  <input type="text" id="aiInput" placeholder="E.g., Tell me about lions in Tanzania">
  <button onclick="getAIFact()">Generate</button>
  <div id="result"></div>
  <script src="ai.js"></script>
</body>
</html>
