<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Animal Explorer</title>
  <style>
    body { font-family: Arial; background: linear-gradient(to right, #FF9800, #F44336); color: white; padding: 40px; animation: fadeIn 1.5s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    form { max-width: 400px; margin: auto; padding: 30px; background: rgba(0,0,0,0.6); border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.4); }
    input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-size: 1em; transition: box-shadow 0.3s; }
    input:focus { box-shadow: 0 0 10px #FFEB3B; }
    button { width: 100%; padding: 15px; background: #4CAF50; border: none; color: white; font-size: 1.2em; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #388E3C; }
    #message { text-align: center; margin-top: 20px; color: #FFEB3B; }
  </style>
</head>
<body>
  <form id="regForm">
    <h2>Register Now</h2>
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="password" id="confirmPass" placeholder="Confirm Password" required>
    <label><input type="checkbox" id="humanCheck"> I'm not a robot (simple proof)</label>
    <button type="submit">Register</button>
  </form>
  <div id="message"></div>
  <script src="script.js"></script>
</body>
</html>
