<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us - African Wildlife Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .input-focus:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .step-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- Keep your navigation if needed, but this is a standalone registration page -->
    
    <div class="glass w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- Progress Bar -->
        <div class="h-1.5 w-full bg-slate-100">
            <div id="progress" class="h-full bg-indigo-600 w-1/3 transition-all duration-500"></div>
        </div>

        <form id="regForm" class="p-8 space-y-6" onsubmit="handleSubmit(event)">
            <!-- Header -->
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Create Account</h1>
                <p class="text-slate-500 text-sm">Join our community of wildlife enthusiasts today.</p>
            </div>

            <!-- Step 1: Personal Info -->
            <div id="step1" class="step-transition space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-700 uppercase">First Name</label>
                        <input type="text" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 input-focus outline-none transition-all" placeholder="John">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-700 uppercase">Last Name</label>
                        <input type="text" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 input-focus outline-none transition-all" placeholder="Doe">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-700 uppercase">Email Address</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-slate-400"><i class="fas fa-envelope"></i></span>
                        <input type="email" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 input-focus outline-none transition-all" placeholder="john@example.com">
                    </div>
                </div>

                <button type="button" onclick="nextStep(2)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                    Next Details <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </div>

            <!-- Step 2: Security -->
            <div id="step2" class="step-transition hidden space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-700 uppercase">Username</label>
                    <input type="text" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 input-focus outline-none transition-all" placeholder="johndoe_wildlife">
                </div>

                <div class="space-y-1 relative">
                    <label class="text-xs font-semibold text-slate-700 uppercase">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-slate-400"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" oninput="checkStrength(this.value)" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 input-focus outline-none transition-all" placeholder="••••••••">
                    </div>
                    <!-- Strength Meter -->
                    <div class="h-1 w-full bg-slate-100 rounded-full mt-2 overflow-hidden">
                        <div id="strengthBar" class="h-full w-0 transition-all duration-300"></div>
                    </div>
                    <p id="strengthText" class="text-[10px] font-bold uppercase mt-1 text-slate-400">Strength: Weak</p>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="nextStep(1)" class="w-1/3 border border-slate-300 text-slate-600 font-semibold py-3 rounded-lg hover:bg-slate-50 transition-all">
                        Back
                    </button>
                    <button type="submit" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg shadow-indigo-200 transition-all">
                        Complete Registration
                    </button>
                </div>
            </div>
        </form>

        <!-- Footer -->
        <div class="bg-slate-50 p-6 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-500">Already have an account? <a href="#" class="text-indigo-600 font-semibold hover:underline">Log in</a></p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center space-y-4 shadow-2xl scale-95 transition-transform">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Welcome to the Family!</h2>
            <p class="text-slate-500 text-sm">Your account has been created. Check your email for a verification link to start exploring African wildlife.</p>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold">Continue to Dashboard</button>
        </div>
    </div>

    <script>
        function nextStep(step) {
            const s1 = document.getElementById('step1');
            const s2 = document.getElementById('step2');
            const progress = document.getElementById('progress');

            if (step === 2) {
                s1.classList.add('hidden');
                s2.classList.remove('hidden');
                progress.style.width = '100%';
            } else {
                s1.classList.remove('hidden');
                s2.classList.add('hidden');
                progress.style.width = '50%';
            }
        }

        function checkStrength(p) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            let strength = 0;

            if (p.length > 5) strength += 25;
            if (p.match(/[A-Z]/)) strength += 25;
            if (p.match(/[0-9]/)) strength += 25;
            if (p.match(/[^A-Za-z0-9]/)) strength += 25;

            bar.style.width = strength + '%';
            
            if (strength <= 25) {
                bar.className = 'h-full bg-red-500 transition-all';
                text.innerText = 'Strength: Weak';
                text.className = 'text-[10px] font-bold uppercase mt-1 text-red-500';
            } else if (strength <= 75) {
                bar.className = 'h-full bg-yellow-500 transition-all';
                text.innerText = 'Strength: Moderate';
                text.className = 'text-[10px] font-bold uppercase mt-1 text-yellow-600';
            } else {
                bar.className = 'h-full bg-green-500 transition-all';
                text.innerText = 'Strength: Secure';
                text.className = 'text-[10px] font-bold uppercase mt-1 text-green-600';
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;

            // Simulate API Call
            setTimeout(() => {
                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('successModal').classList.add('flex');
            }, 1500);
        }
    </script>
</body>
</html>
