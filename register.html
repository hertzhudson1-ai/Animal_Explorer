<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Us - African Wildlife Sanctuary</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
body { font-family: 'Inter', sans-serif; }

.glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); }
.dark .glass { background: rgba(30,41,59,0.9); }

.step { transition: all 0.5s ease; }
.fade-in { animation: fade 0.5s ease forwards; }
@keyframes fade { from {opacity:0; transform:translateX(20px);} to {opacity:1; transform:translateX(0);} }

.input-error { border-color: #ef4444 !important; }
.error-text { color:#ef4444; font-size:12px; }

.requirement.valid { color:#22c55e; }
.requirement.invalid { color:#ef4444; }

.modal-animate { animation: pop 0.4s ease forwards; }
@keyframes pop { from {opacity:0; transform:scale(.8);} to {opacity:1; transform:scale(1);} }
</style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-500">

<!-- Dark Mode Toggle -->
<button onclick="toggleDarkMode()" class="fixed top-5 right-5 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm shadow">
    <i class="fas fa-moon"></i> Toggle Theme
</button>

<div class="glass w-full max-w-xl rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700">

<!-- Progress -->
<div class="h-2 bg-slate-200 dark:bg-slate-700">
    <div id="progress" class="h-full bg-indigo-600 transition-all duration-500 w-1/3"></div>
</div>

<form id="regForm" class="p-8 space-y-6">

<!-- Header -->
<div class="text-center">
<h1 class="text-3xl font-bold text-slate-900 dark:text-white">Create Account</h1>
<p class="text-slate-500 text-sm dark:text-slate-400">Protecting wildlife starts with you.</p>
</div>

<!-- STEP 1 -->
<div id="step1" class="step space-y-4 fade-in">
<div>
<label class="text-xs font-semibold uppercase">First Name</label>
<input type="text" id="firstName" class="w-full px-4 py-2 border rounded-lg" required>
<p class="error-text hidden" id="firstNameError">First name required</p>
</div>

<div>
<label class="text-xs font-semibold uppercase">Email</label>
<input type="email" id="email" class="w-full px-4 py-2 border rounded-lg" required>
<p class="error-text hidden" id="emailError">Valid email required</p>
</div>

<button type="button" onclick="nextStep(2)" class="w-full bg-indigo-600 text-white py-3 rounded-lg">Next</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="step hidden space-y-4">
<div>
<label class="text-xs font-semibold uppercase">Username</label>
<input type="text" id="username" class="w-full px-4 py-2 border rounded-lg" required>
</div>

<div>
<label class="text-xs font-semibold uppercase">Password</label>
<div class="relative">
<input type="password" id="password" oninput="validatePassword()" class="w-full px-4 py-2 border rounded-lg">
<button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-sm">
<i class="fas fa-eye"></i>
</button>
</div>

<!-- Requirements -->
<ul class="text-xs space-y-1 mt-2">
<li id="reqLength" class="requirement invalid">• At least 8 characters</li>
<li id="reqUpper" class="requirement invalid">• One uppercase letter</li>
<li id="reqNumber" class="requirement invalid">• One number</li>
<li id="reqSymbol" class="requirement invalid">• One special character</li>
</ul>

<div class="h-1 bg-slate-200 rounded mt-2">
<div id="strengthBar" class="h-full w-0 transition-all duration-300"></div>
</div>

</div>

<div>
<label class="text-xs font-semibold uppercase">Confirm Password</label>
<input type="password" id="confirmPassword" oninput="checkMatch()" class="w-full px-4 py-2 border rounded-lg">
<p id="matchError" class="error-text hidden">Passwords do not match</p>
</div>

<div class="flex gap-3">
<button type="button" onclick="nextStep(1)" class="w-1/3 border py-3 rounded-lg">Back</button>
<button type="button" onclick="nextStep(3)" class="w-2/3 bg-indigo-600 text-white py-3 rounded-lg">Next</button>
</div>
</div>

<!-- STEP 3 -->
<div id="step3" class="step hidden space-y-4">

<label class="text-xs font-semibold uppercase">Areas of Interest</label>
<div class="grid grid-cols-2 gap-3 text-sm">
<label><input type="checkbox"> Safari Tours</label>
<label><input type="checkbox"> Conservation</label>
<label><input type="checkbox"> Photography</label>
<label><input type="checkbox"> Volunteering</label>
</div>

<div class="flex gap-3 pt-3">
<button type="button" onclick="nextStep(2)" class="w-1/3 border py-3 rounded-lg">Back</button>
<button type="submit" class="w-2/3 bg-green-600 text-white py-3 rounded-lg">
<i class="fas fa-user-plus"></i> Complete Registration
</button>
</div>

</div>
</form>
</div>

<!-- SUCCESS MODAL -->
<div id="successModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center">
<div class="bg-white dark:bg-slate-800 p-8 rounded-2xl text-center modal-animate">
<i class="fas fa-check-circle text-5xl text-green-500"></i>
<h2 class="text-2xl font-bold mt-3 dark:text-white">Account Created!</h2>
<p class="text-sm text-slate-500 dark:text-slate-400">Welcome to the African Wildlife Sanctuary.</p>
<button onclick="location.reload()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-lg">Continue</button>
</div>
</div>

<script>
// Step navigation
function nextStep(step){
document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden'));
document.getElementById('step'+step).classList.remove('hidden');
document.getElementById('progress').style.width = (step*33)+'%';
localStorage.setItem("formStep",step);
}

// Password validation
function validatePassword(){
const p=document.getElementById("password").value;
let strength=0;

toggleReq("reqLength",p.length>=8);
toggleReq("reqUpper",/[A-Z]/.test(p));
toggleReq("reqNumber",/[0-9]/.test(p));
toggleReq("reqSymbol",/[^A-Za-z0-9]/.test(p));

if(p.length>=8) strength+=25;
if(/[A-Z]/.test(p)) strength+=25;
if(/[0-9]/.test(p)) strength+=25;
if(/[^A-Za-z0-9]/.test(p)) strength+=25;

const bar=document.getElementById("strengthBar");
bar.style.width=strength+"%";
bar.className="h-full transition-all "+(strength<50?"bg-red-500":strength<75?"bg-yellow-500":"bg-green-500");
}

function toggleReq(id,valid){
const el=document.getElementById(id);
el.classList.remove("valid","invalid");
el.classList.add(valid?"valid":"invalid");
}

function checkMatch(){
const p=document.getElementById("password").value;
const c=document.getElementById("confirmPassword").value;
document.getElementById("matchError").classList.toggle("hidden",p===c);
}

function togglePassword(){
const p=document.getElementById("password");
p.type=p.type==="password"?"text":"password";
}

// Dark mode
function toggleDarkMode(){
document.documentElement.classList.toggle("dark");
}

// Submit
document.getElementById("regForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("successModal").classList.remove("hidden");
document.getElementById("successModal").classList.add("flex");
});
</script>

</body>
</html>
